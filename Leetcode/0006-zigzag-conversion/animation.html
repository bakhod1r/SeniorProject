<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zigzag Conversion — Two Approaches</title>
<style>
  :root{
    --bg:#0a0d12; --bg2:#0d1117; --surface:#141a22; --surface2:#1b232e;
    --border:#222c38; --border2:#2c3848;
    --text:#e6edf3; --muted:#8b97a6; --faint:#5b6675;
    --blue:#4f9dff; --blue-dim:#16314f;
    --yellow:#f4b740; --yellow-dim:#3a2c08;
    --green:#34d399; --green-dim:#0c2c22;
    --red:#f85149;
    --accent:#34d399;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px -12px rgba(0,0,0,.6);
    --mono:'SF Mono',ui-monospace,'JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); background:
      radial-gradient(1200px 600px at 80% -10%, #10202e 0%, transparent 60%),
      radial-gradient(900px 500px at 0% 0%, #161226 0%, transparent 55%),
      var(--bg);
    color:var(--text); min-height:100vh; padding:28px 24px 120px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px; margin:0 auto;}

  /* header */
  .head{display:flex; align-items:flex-start; gap:14px; margin-bottom:6px;}
  .back{width:40px; height:40px; flex:none; border-radius:11px; border:1px solid var(--border2);
    background:var(--surface); color:var(--muted); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;}
  .back:hover{color:var(--text); border-color:var(--blue);}
  h1{font-size:2rem; font-weight:700; letter-spacing:-.02em; line-height:1.1;}
  .pill{display:inline-flex; align-items:center; padding:3px 11px; border-radius:999px;
    font-size:.78rem; font-weight:600; vertical-align:middle; margin-left:10px;}
  .pill.easy{background:rgba(52,211,153,.13); color:var(--green); border:1px solid rgba(52,211,153,.25);}
  .pill.med{background:rgba(244,183,64,.13); color:var(--yellow); border:1px solid rgba(244,183,64,.28);}
  .pill.hard{background:rgba(248,81,73,.13); color:var(--red); border:1px solid rgba(248,81,73,.28);}
  .tags{display:flex; gap:8px; margin:14px 0 8px;}
  .tag{padding:5px 13px; border-radius:999px; font-size:.82rem; color:var(--muted);
    background:var(--surface); border:1px solid var(--border);}
  .lede{color:var(--muted); font-size:1.02rem; line-height:1.5; max-width:780px; margin-top:4px;}
  .lede b{color:var(--text); font-weight:600;}
  .lede code{font-family:var(--mono); color:var(--blue); font-size:.9em;}

  /* layout */
  .grid{display:grid; grid-template-columns:1fr 384px; gap:20px; margin-top:24px;}
  .card{background:linear-gradient(180deg, var(--surface) 0%, var(--bg2) 100%);
    border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);}
  .card.pad{padding:18px 20px;}
  .side{display:flex; flex-direction:column; gap:16px;}
  .label{font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:12px;}

  /* approach selector */
  .approaches{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .approaches .segmented{flex-wrap:wrap;}
  .comp{font-family:var(--mono); font-size:.8rem; color:var(--muted); white-space:nowrap;}
  .comp b{color:var(--green);}

  /* presets */
  .toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .segmented{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:3px;}
  .segmented button{border:none; background:transparent; color:var(--muted); font-family:inherit;
    font-size:.84rem; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer; transition:.15s;}
  .segmented button:hover{color:var(--text);}
  .segmented button.on{background:var(--surface2); color:var(--text); box-shadow:0 1px 0 rgba(255,255,255,.04);}
  .ghost{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border2);
    background:var(--surface); color:var(--text); font-family:inherit; font-size:.84rem; font-weight:600;
    padding:8px 14px; border-radius:10px; cursor:pointer; transition:.15s;}
  .ghost:hover{border-color:var(--blue); color:var(--blue);}

  /* stage */
  .stage{padding:22px 24px 28px; border-top:1px solid var(--border);}
  .compare{text-align:center; font-family:var(--mono); font-size:1rem; color:var(--yellow);
    min-height:1.4em; margin-bottom:24px; letter-spacing:.01em;}
  .compare .dim{color:var(--faint);}
  .compare .ans{color:var(--green); font-weight:700;}
  .rowlabel{font-family:var(--mono); font-size:.78rem; color:var(--faint); margin:0 0 10px 2px;}
  .rowlabel.sp{margin-top:34px;}

  .cells{display:grid; gap:12px; justify-content:start;}
  .cell{position:relative; height:64px; border-radius:12px; border:1.5px solid var(--border2);
    background:var(--bg); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:1.15rem; font-weight:600; color:var(--text);
    transition:transform .2s, background .2s, border-color .2s, box-shadow .2s;}
  .cell .ix{position:absolute; bottom:-20px; left:0; right:0; text-align:center; font-size:.72rem; color:var(--faint); font-weight:500;}
  .cell.stored{border-color:var(--blue); background:var(--blue-dim); color:#bdd9ff; opacity:.85;}
  .cell.ptr{border-color:var(--blue); background:var(--blue-dim); color:#bdd9ff;}
  .cell.cur{border-color:var(--yellow); background:var(--yellow-dim); color:#ffd887; box-shadow:0 0 0 1px var(--yellow), 0 8px 22px -10px rgba(244,183,64,.5); transform:translateY(-3px);}
  .cell.match{border-color:var(--green); background:var(--green-dim); color:#9af3d3; box-shadow:0 0 0 1px var(--green), 0 10px 24px -8px rgba(52,211,153,.55); transform:translateY(-3px);}
  .cell.empty{border-style:dashed; border-color:var(--border); color:var(--faint); opacity:.5;}

  .arrow{position:absolute; left:0; right:0; text-align:center; font-family:var(--mono); font-size:.74rem; font-weight:700; line-height:1; pointer-events:none; color:var(--blue);}
  .arrow.below{bottom:-40px;}
  .arrow b{display:block; font-size:.9rem;}

  /* hash map chips */
  .chips{display:flex; flex-wrap:wrap; gap:10px; min-height:50px; align-content:flex-start;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:9px 13px; border-radius:11px;
    font-family:var(--mono); font-size:.95rem; font-weight:600; color:var(--text);
    background:var(--bg); border:1.5px solid var(--border2); transition:.2s;}
  .chip span{color:var(--faint); font-size:.82rem; font-weight:500;}
  .chip.add{border-color:var(--green); background:var(--green-dim); color:#9af3d3; box-shadow:0 0 0 1px var(--green), 0 8px 20px -10px rgba(52,211,153,.5);}
  .chip.add span{color:#5fd3ad;}
  .chip.hit{border-color:var(--yellow); background:var(--yellow-dim); color:#ffd887; box-shadow:0 0 0 1px var(--yellow), 0 8px 20px -10px rgba(244,183,64,.5);}
  .chip.hit span{color:#d8b25c;}
  .chip-empty{font-family:var(--mono); font-size:.85rem; color:var(--faint); padding:14px 2px;}

  /* transport */
  .transport{position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    width:min(1100px, calc(100% - 40px)); z-index:30; display:flex; align-items:center; gap:16px;
    background:rgba(16,21,28,.92); backdrop-filter:blur(14px); border:1px solid var(--border2);
    border-radius:18px; padding:12px 18px; box-shadow:0 14px 40px -12px rgba(0,0,0,.75);}
  .tbtn{width:38px; height:38px; border-radius:50%; border:1px solid var(--border2);
    background:var(--surface); color:var(--text); cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; transition:.15s;}
  .tbtn:hover:not(:disabled){border-color:var(--blue); color:var(--blue);}
  .tbtn:disabled{opacity:.35; cursor:not-allowed;}
  .tbtn svg{width:16px; height:16px; fill:currentColor;}
  .play{width:54px; height:54px; border:none; background:var(--accent); color:#04130d;
    box-shadow:0 0 0 6px rgba(52,211,153,.13), 0 8px 20px -6px rgba(52,211,153,.5);}
  .play:hover:not(:disabled){filter:brightness(1.08); border:none; color:#04130d;}
  .play svg{width:20px; height:20px;}
  .scrub{flex:1; display:flex; align-items:center;}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:999px;
    background:var(--border2); outline:none; cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2px solid #04130d; box-shadow:0 0 0 3px rgba(52,211,153,.2);}
  input[type=range].track-green{background:linear-gradient(90deg, var(--accent) var(--p,0%), var(--border2) var(--p,0%));}
  .counter{font-family:var(--mono); font-size:.85rem; color:var(--muted); min-width:52px; text-align:center;}
  .speed{display:flex; align-items:center; gap:8px;}
  .speed svg{width:15px; height:15px; fill:var(--muted);}
  .speed input[type=range]{width:92px;}
  .mult{font-family:var(--mono); font-size:.82rem; color:var(--muted); min-width:42px; text-align:right;}

  /* side */
  .narr{display:flex; gap:11px; align-items:flex-start; padding:15px 17px;
    background:linear-gradient(180deg, var(--surface2), var(--surface)); border:1px solid var(--border2);
    border-radius:14px; font-size:.92rem; line-height:1.5; color:var(--text);}
  .narr .dotg{width:9px; height:9px; border-radius:50%; background:var(--green); margin-top:6px; flex:none; box-shadow:0 0 10px var(--green);}
  .narr code{font-family:var(--mono); color:var(--yellow); font-size:.88em;}

  .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .metric{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:13px 14px;}
  .metric .v{font-family:var(--mono); font-size:1.5rem; font-weight:700; line-height:1; color:var(--text);}
  .metric .v.muted{color:var(--faint);}
  .metric .k{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-top:7px; font-weight:600;}
  .metric.wide{grid-column:span 3; display:flex; align-items:baseline; gap:10px;}
  .metric.wide .v{font-size:1.25rem; color:var(--blue);}

  .code{font-family:var(--mono); font-size:.83rem; line-height:1.75; overflow-x:auto;}
  .code .ln{display:flex; gap:14px; padding:1px 8px; border-radius:6px; white-space:pre;}
  .code .ln .no{color:var(--faint); width:14px; text-align:right; user-select:none; flex:none;}
  .code .ln.active{background:linear-gradient(90deg, rgba(244,183,64,.14), rgba(244,183,64,.02)); box-shadow:inset 2px 0 0 var(--yellow);}
  .code .ln.active .no{color:var(--yellow);}
  .code .kw{color:#ff7b9c;} .code .fn{color:var(--blue);} .code .nu{color:#c3a6ff;} .code .op{color:var(--muted);}
  .code .cm{color:#6b7889; font-style:italic;} .code .st{color:#9ad07f;} .code .ty{color:#7ee0c8;}

  .codetabs{display:inline-flex; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; margin-bottom:13px;}
  .codetabs button{border:none; background:transparent; color:var(--muted); font-family:inherit; font-size:.78rem; font-weight:600; padding:5px 11px; border-radius:7px; cursor:pointer; transition:.15s;}
  .codetabs button:hover{color:var(--text);}
  .codetabs button.on{background:var(--surface2); color:var(--text); box-shadow:0 1px 0 rgba(255,255,255,.04);}
  .src{font-family:var(--mono); font-size:.78rem; line-height:1.65; color:#cdd6e0; white-space:pre; overflow:auto; max-height:360px; margin:0;}
  .src[hidden]{display:none;}

  .legend{display:flex; flex-direction:column; gap:9px;}
  .legend .it{display:flex; align-items:center; gap:9px; font-size:.85rem; color:var(--muted);}
  .legend .sw{width:14px; height:14px; border-radius:4px; flex:none;}
  .sw.blue{background:var(--blue-dim); border:1.5px solid var(--blue);}
  .sw.yellow{background:var(--yellow-dim); border:1.5px solid var(--yellow);}
  .sw.green{background:var(--green-dim); border:1.5px solid var(--green);}

  .how{font-size:.9rem; line-height:1.6; color:var(--muted);}
  .how b{color:var(--text); font-weight:600;}
  .how p+p{margin-top:9px;}

  @media (max-width:920px){
    .grid{grid-template-columns:1fr;}
    body{padding:20px 14px 130px;}
    h1{font-size:1.6rem;}
  }

  /* ===== light theme + theme toggle (injected) ===== */
  :root[data-theme="light"]{
    --bg:#f4f7fc; --bg2:#ffffff; --surface:#ffffff; --surface2:#eef3f9;
    --border:#e2e8f1; --border2:#cfd9e6;
    --text:#101826; --muted:#566372; --faint:#8895a6;
    --blue:#1f6feb; --blue-dim:#dce8ff;
    --yellow:#a9750b; --yellow-dim:#faedcc;
    --green:#0e9d68; --green-dim:#d4f4e7;
    --red:#d12d28;
    --shadow:0 1px 0 rgba(255,255,255,.7), 0 10px 28px -14px rgba(20,40,70,.22);
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #e7f0ff 0%, transparent 60%),
      radial-gradient(900px 500px at 0% 0%, #efeaff 0%, transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] .cell.stored, :root[data-theme="light"] .cell.ptr,
  :root[data-theme="light"] .node.done{color:#1b4fd1;}
  :root[data-theme="light"] .cell.cur, :root[data-theme="light"] .node.cur{color:#8a5a06;}
  :root[data-theme="light"] .cell.match, :root[data-theme="light"] .node.written,
  :root[data-theme="light"] .node.fresh{color:#0a7d57;}
  :root[data-theme="light"] .chip.add, :root[data-theme="light"] .chip.add span{color:#0a7d57;}
  :root[data-theme="light"] .chip.hit, :root[data-theme="light"] .chip.hit span{color:#8a5a06;}
  :root[data-theme="light"] .transport{background:rgba(255,255,255,.86);}
  :root[data-theme="light"] .code .kw{color:#cf2c6b;}
  :root[data-theme="light"] .code .fn{color:#1f6feb;}
  :root[data-theme="light"] .code .nu{color:#7c3aed;}
  :root[data-theme="light"] .code .cm{color:#7a8694;}
  :root[data-theme="light"] .code .st{color:#1a7f37;}
  :root[data-theme="light"] .code .ty{color:#0d8a8a;}
  .themetoggle{position:fixed; top:20px; right:22px; z-index:40; width:40px; height:40px;
    border-radius:11px; border:1px solid var(--border2); background:var(--surface); color:var(--muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; box-shadow:var(--shadow);}
  .themetoggle:hover{color:var(--text); border-color:var(--blue);}
  .themetoggle svg{width:18px; height:18px;}
</style>
</head>
<body>
<script>(function(){try{if(localStorage.getItem('lc-anim-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<button class="themetoggle" id="themeToggle" title="Toggle light / dark" aria-label="Toggle theme"></button>
<div class="wrap">

  <div class="head">
    <button class="back" title="(prototype) back">&#8592;</button>
    <div>
      <h1>Zigzag Conversion<span class="pill med">Medium</span></h1>
      <div class="tags">
        <span class="tag">string</span>
        <span class="tag">simulation</span>
        <span class="tag">math</span>
      </div>
      <p class="lede">Write <b>s</b> in a zigzag across <code>numRows</code> rows, then read row by row.
      Two approaches — simulate the bounce, or compute each row's indices with the period formula.</p>
    </div>
  </div>

  <div class="grid">
    <!-- main -->
    <div class="card">
      <div class="pad">
        <div class="approaches">
          <div class="segmented" id="approaches"></div>
          <span class="comp" id="comp"></span>
        </div>
        <div class="toolbar">
          <div class="segmented" id="presets">
            <button data-p="rows3" class="on">3 rows</button>
            <button data-p="rows4">4 rows</button>
            <button data-p="rows2">2 rows</button>
            <button data-p="single">numRows 1</button>
          </div>
          <button class="ghost" id="newBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
            New input
          </button>
        </div>
      </div>

      <div class="stage" id="stage"></div>
    </div>

    <!-- side -->
    <div class="side">
      <div class="narr"><span class="dotg"></span><span id="narration">Press play to watch the algorithm run.</span></div>

      <div class="card pad">
        <div class="label">Metrics</div>
        <div class="metrics" id="metrics"></div>
      </div>

      <div class="card pad">
        <div class="codetabs" id="codetabs">
          <button data-v="pseudo" class="on">Pseudo</button>
          <button data-v="py">Python</button>
          <button data-v="java">Java</button>
          <button data-v="go">Go</button>
        </div>
        <div class="code" id="code"></div>
      </div>

      <div class="card pad">
        <div class="label">Legend</div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="card pad">
        <div class="label">How it works</div>
        <div class="how" id="how"></div>
      </div>
    </div>
  </div>
</div>

<!-- transport -->
<div class="transport">
  <button class="tbtn" id="resetBtn" title="Reset">
    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
  </button>
  <button class="tbtn" id="prevBtn" title="Previous">
    <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
  </button>
  <button class="tbtn play" id="playBtn" title="Play / Pause">
    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="tbtn" id="nextBtn" title="Next">
    <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
  </button>
  <div class="scrub"><input type="range" id="scrub" class="track-green" min="0" max="0" value="0"></div>
  <div class="counter" id="counter">0 / 0</div>
  <div class="speed">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
    <input type="range" id="speed" min="0" max="6" value="3">
    <span class="mult" id="mult">1&times;</span>
  </div>
</div>

<script>
"use strict";
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ---------- tiny syntax highlighter for the language code views ----------
const KEYWORDS = {
  py: new Set(['def','class','return','if','elif','else','for','while','in','is','not','and','or','None','True','False','lambda','import','from','as','with','pass','break','continue','self']),
  java: new Set(['public','private','protected','class','interface','void','int','long','double','float','boolean','char','byte','short','new','return','if','else','for','while','do','static','final','this','null','true','false','import','package','extends','implements','switch','case','default','break','continue']),
  go: new Set(['func','range','for','if','else','return','make','map','struct','type','nil','var','const','package','import','chan','go','defer','bool','int','int64','string','true','false','switch','case','default','break','continue','byte','rune'])
};
// Types worth tinting (rendered as .ty) when they appear as bare identifiers.
const TYPES = new Set(['Integer','Map','HashMap','Math','Arrays','List','String','StringBuilder','Object']);
const RE_PY = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\b)|([A-Za-z_]\w*)/g;
const RE_C  = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`[^`]*`)|(\b\d+\b)|([A-Za-z_]\w*)/g;
function highlight(line, lang){
  const kw = KEYWORDS[lang] || new Set();
  const re = lang === 'py' ? RE_PY : RE_C;
  re.lastIndex = 0;
  let out = '', last = 0, m;
  while ((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    if (m[1]) out += '<span class="cm">'+esc(m[1])+'</span>';
    else if (m[2]) out += '<span class="st">'+esc(m[2])+'</span>';
    else if (m[3]) out += '<span class="nu">'+esc(m[3])+'</span>';
    else {
      const w = m[4];
      if (kw.has(w)) out += '<span class="kw">'+esc(w)+'</span>';
      else if (TYPES.has(w)) out += '<span class="ty">'+esc(w)+'</span>';
      else if (/^\s*\(/.test(line.slice(m.index + w.length))) out += '<span class="fn">'+esc(w)+'</span>';
      else out += esc(w);
    }
    last = re.lastIndex;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  out += esc(line.slice(last));
  return out || ' ';
}

// ---------- datasets (a solution is guaranteed to exist) ----------
const PRESETS = {
  rows3:  { s:'PAYPALISHIRING', numRows:3 },
  rows4:  { s:'PAYPALISHIRING', numRows:4 },
  rows2:  { s:'ABCDE',          numRows:2 },
  single: { s:'A',              numRows:1 }
};

// shared row helpers
const inputLabel = 's <span style="color:var(--faint)">(read each char left → right)</span>';
const numRowsMetric = nr => ({ k:'numRows', v:'numRows = '+nr, wide:true });

// ======================================================================
// APPROACHES — each owns its pseudocode, legend, prose and buildFrames.
// A frame is approach-agnostic: { rows, metrics, compare, narration, codeLine }.
//   row = { type:'cells', label, cells:[{value, ix, cls, arrow}] }
// ======================================================================
const APPROACHES = [
{
  id:'sim', label:'Simulate ★', comp:'O(n) time · O(n) space',
  src:{
    py:`def convert(self, s, numRows):
    if numRows == 1 or numRows >= len(s):
        return s
    rows = [[] for _ in range(numRows)]
    cur_row, going_down = 0, False
    for ch in s:
        rows[cur_row].append(ch)
        if cur_row == 0 or cur_row == numRows - 1:
            going_down = not going_down
        cur_row += 1 if going_down else -1
    return "".join(ch for row in rows for ch in row)`,
    java:`public String convert(String s, int numRows) {
    if (numRows == 1 || numRows >= s.length()) return s;
    StringBuilder[] rows = new StringBuilder[numRows];
    for (int i = 0; i < numRows; i++) rows[i] = new StringBuilder();
    int curRow = 0;
    boolean goingDown = false;
    for (char c : s.toCharArray()) {
        rows[curRow].append(c);
        if (curRow == 0 || curRow == numRows - 1) goingDown = !goingDown;
        curRow += goingDown ? 1 : -1;
    }
    StringBuilder result = new StringBuilder();
    for (StringBuilder row : rows) result.append(row);
    return result.toString();
}`,
    go:`func convert(s string, numRows int) string {
    if numRows == 1 || numRows >= len(s) {
        return s
    }
    rows := make([][]byte, numRows)
    for i := range rows {
        rows[i] = make([]byte, 0)
    }
    curRow := 0
    goingDown := false
    for i := 0; i < len(s); i++ {
        rows[curRow] = append(rows[curRow], s[i])
        if curRow == 0 || curRow == numRows-1 {
            goingDown = !goingDown
        }
        if goingDown {
            curRow++
        } else {
            curRow--
        }
    }
    result := make([]byte, 0, len(s))
    for _, row := range rows {
        result = append(result, row...)
    }
    return string(result)
}`},
  map:{
    py:{ 1:2, 2:4, 3:5, 4:6, 5:7, 6:8, 7:10, 8:11 },
    java:{ 1:2, 2:3, 3:5, 4:7, 5:8, 6:9, 7:10, 8:14 },
    go:{ 1:2, 2:5, 3:9, 4:11, 5:12, 6:13, 7:16, 8:26 }
  },
  legend:[['yellow','Current char being placed'],['blue','Already placed in a row'],['green','Final answer']],
  how:'<p>Write the string physically: start at row 0, walk <b>down</b> one row per character, '+
      'and when you hit the bottom row reverse to <b>up</b>; reverse again at the top. '+
      'Each character lands in <code>rows[curRow]</code>.</p>'+
      '<p>One pass, <b>O(n)</b> time, <b>O(n)</b> space for the row buffers. '+
      'Guard <code>numRows == 1</code> (or <code>numRows ≥ len(s)</code>): nothing to fold, return <code>s</code>.</p>',
  code:[
    [['kw','if'],['op',' numRows == '],['nu','1'],['op',' '],['kw','or'],['op',' numRows >= len(s): '],['kw','return'],['op',' s']],
    [['fn','rows'],['op',' = [[] '],['kw','for'],['op',' _ '],['kw','in'],['op',' range(numRows)]']],
    [['op','curRow = '],['nu','0'],['op','; goingDown = '],['kw','False']],
    [['kw','for'],['op',' ch '],['kw','in'],['op',' s:']],
    [['op','  rows[curRow].append(ch)']],
    [['kw','  if'],['op',' curRow == '],['nu','0'],['op',' '],['kw','or'],['op',' curRow == numRows-'],['nu','1'],['op',': goingDown = '],['kw','not'],['op',' goingDown']],
    [['op','  curRow += '],['nu','1'],['op',' '],['kw','if'],['op',' goingDown '],['kw','else'],['op',' -'],['nu','1']],
    [['kw','return'],['op',' join(rows)']]
  ],
  build(s, numRows){
    const n = s.length, frames = [];
    const chars = s.split('');

    // edge case: no zigzag
    if (numRows === 1 || numRows >= n){
      const inputRow = (cur) => ({ type:'cells', label:inputLabel,
        cells: chars.map((ch,i)=>({ value:ch, ix:i, cls: cur===i?'cur':'', arrow: cur===i?'i':'' })) });
      frames.push({ rows:[inputRow(null)],
        metrics:[{k:'curRow',v:'—'},{k:'dir',v:'—'},{k:'placed',v:0},numRowsMetric(numRows)],
        compare:'numRows = '+numRows+(numRows===1?'  →  single row':'  ≥  len(s)='+n),
        narration:'Edge case: <code>numRows == 1</code> or <code>numRows ≥ len(s)</code>. No zigzag — return <code>s</code> unchanged.',
        codeLine:1 });
      frames.push({ rows:[inputRow(null)],
        metrics:[{k:'curRow',v:'—'},{k:'dir',v:'—'},{k:'placed',v:n},numRowsMetric(numRows)],
        compare:'<span class="ans">✓ "'+esc(s)+'"</span>',
        narration:'Return <code>s</code> as-is → <code>"'+esc(s)+'"</code>.',
        codeLine:1, done:true });
      return frames;
    }

    // simulate
    const rows = Array.from({length:numRows}, ()=>[]);   // each holds {ch, i}
    const rowOf = new Array(n);                           // index -> row
    let curRow = 0, goingDown = false, placed = 0;

    const inputRow = (cur) => ({ type:'cells', label:inputLabel,
      cells: chars.map((ch,i)=>{
        let cls = '';
        if (i === cur) cls = 'cur';
        else if (rowOf[i] != null) cls = 'stored';
        return { value:ch, ix:i, cls, arrow: i===cur ? 'i' : '' };
      }) });

    // one cells row per zigzag row; just-placed cell marked 'cur', rest 'stored'
    const zigRows = (justRow, justPos, done) => rows.map((row,r)=>({
      type:'cells',
      label:'row '+r+(r===0?' (top)':(r===numRows-1?' (bottom)':'')),
      cells: row.length
        ? row.map((e,k)=>({
            value:e.ch, ix:e.i,
            cls: done ? 'match' : (r===justRow && k===justPos ? 'cur' : 'stored')
          }))
        : [{ value:'·', ix:null, cls:'empty' }]
    }));

    const dirLabel = d => d ? 'down ↓' : 'up ↑';
    const mets = (placedN) => [
      { k:'curRow', v: curRow },
      { k:'dir', v: dirLabel(goingDown) },
      { k:'placed', v: placedN },
      numRowsMetric(numRows)
    ];

    frames.push({ rows:[inputRow(null), ...zigRows(-1,-1,false)], metrics:mets(0),
      compare:'numRows = '+numRows+'   curRow = 0   dir = up',
      narration:'Bounce between '+numRows+' rows. Start at <code>curRow = 0</code>, direction flips at top &amp; bottom.',
      codeLine:3 });

    for (let i=0;i<n;i++){
      const ch = chars[i];
      // place
      rows[curRow].push({ ch, i });
      rowOf[i] = curRow;
      placed++;
      const justPos = rows[curRow].length - 1;
      const placedRow = curRow;
      frames.push({ rows:[inputRow(i), ...zigRows(placedRow, justPos, false)], metrics:mets(placed),
        compare:"place  s["+i+"] = '"+esc(ch)+"'  →  row "+placedRow,
        narration:"Place <code>s["+i+"] = '"+esc(ch)+"'</code> into <code>row "+placedRow+"</code>.",
        codeLine:5 });

      // flip direction at boundaries
      if (curRow === 0 || curRow === numRows-1){
        goingDown = !goingDown;
        frames.push({ rows:[inputRow(i), ...zigRows(placedRow, justPos, false)], metrics:mets(placed),
          compare:'curRow = '+curRow+(curRow===0?' (top)':' (bottom)')+'  →  flip dir to '+dirLabel(goingDown),
          narration:'At '+(curRow===0?'the top':'the bottom')+' row → reverse direction to <code>'+dirLabel(goingDown)+'</code>.',
          codeLine:6 });
      }
      // move
      curRow += goingDown ? 1 : -1;
    }

    // build result string
    const result = rows.map(row=>row.map(e=>e.ch).join('')).join('');
    frames.push({ rows:[inputRow(null), ...zigRows(-1,-1,true)], metrics:mets(placed),
      compare:'<span class="ans">✓ "'+esc(result)+'"</span>',
      narration:'Read each row left → right and concatenate → <code>"'+esc(result)+'"</code>.',
      codeLine:8, done:true });
    return frames;
  }
},
{
  id:'math', label:'Math (Direct Index)', comp:'O(n) time · O(n) space',
  src:{
    py:`def convert(self, s, numRows):
    if numRows == 1 or numRows >= len(s):
        return s
    period = 2 * (numRows - 1)
    result = []
    for r in range(numRows):
        for j in range(r, len(s), period):
            result.append(s[j])
            if 0 < r < numRows - 1:
                diag = j + period - 2 * r
                if diag < len(s):
                    result.append(s[diag])
    return "".join(result)`,
    java:`public String convertMath(String s, int numRows) {
    if (numRows == 1 || numRows >= s.length()) return s;
    int period = 2 * (numRows - 1);
    StringBuilder result = new StringBuilder();
    for (int r = 0; r < numRows; r++) {
        for (int j = r; j < s.length(); j += period) {
            result.append(s.charAt(j));
            if (r != 0 && r != numRows - 1) {
                int diag = j + period - 2 * r;
                if (diag < s.length()) result.append(s.charAt(diag));
            }
        }
    }
    return result.toString();
}`,
    go:`func convertMath(s string, numRows int) string {
    if numRows == 1 || numRows >= len(s) {
        return s
    }
    period := 2 * (numRows - 1)
    result := make([]byte, 0, len(s))
    for r := 0; r < numRows; r++ {
        for j := r; j < len(s); j += period {
            result = append(result, s[j])
            if r != 0 && r != numRows-1 {
                diag := j + period - 2*r
                if diag < len(s) {
                    result = append(result, s[diag])
                }
            }
        }
    }
    return string(result)
}`},
  map:{
    py:{ 1:2, 2:4, 3:6, 4:7, 5:8, 6:9, 7:10, 8:11, 9:13 },
    java:{ 1:2, 2:3, 3:5, 4:6, 5:7, 6:8, 7:9, 8:10, 9:14 },
    go:{ 1:2, 2:5, 3:7, 4:8, 5:9, 6:10, 7:11, 8:12, 9:18 }
  },
  legend:[['yellow','Char picked this step'],['blue','Already collected'],['green','Final answer']],
  how:'<p>Skip the simulation — the zigzag is <b>periodic</b> with <code>period = 2·(numRows−1)</code>. '+
      'Row <b>r</b> always contains the main-column chars at <code>r, r+period, …</code>.</p>'+
      '<p>Interior rows (<code>0 &lt; r &lt; numRows−1</code>) also carry a diagonal char at '+
      '<code>j + period − 2r</code> within the same cycle. Collect row by row → <b>O(n)</b> time, <b>O(n)</b> output.</p>',
  code:[
    [['kw','if'],['op',' numRows == '],['nu','1'],['op',' '],['kw','or'],['op',' numRows >= len(s): '],['kw','return'],['op',' s']],
    [['op','period = '],['nu','2'],['op','*(numRows-'],['nu','1'],['op',')']],
    [['kw','for'],['op',' r '],['kw','in'],['op',' range(numRows):']],
    [['kw','  for'],['op',' j '],['kw','in'],['op',' range(r, len(s), period):']],
    [['op','    result.append(s[j])']],
    [['kw','    if'],['op',' '],['nu','0'],['op',' < r < numRows-'],['nu','1'],['op',':']],
    [['op','      diag = j + period - '],['nu','2'],['op','*r']],
    [['kw','      if'],['op',' diag < len(s): result.append(s[diag])']],
    [['kw','return'],['op',' join(result)']]
  ],
  build(s, numRows){
    const n = s.length, frames = [];
    const chars = s.split('');

    if (numRows === 1 || numRows >= n){
      const inputRow = () => ({ type:'cells', label:inputLabel,
        cells: chars.map((ch,i)=>({ value:ch, ix:i, cls:'', arrow:'' })) });
      frames.push({ rows:[inputRow()],
        metrics:[{k:'period',v:'—'},{k:'r',v:'—'},{k:'collected',v:0},numRowsMetric(numRows)],
        compare:'numRows = '+numRows+(numRows===1?'  →  single row':'  ≥  len(s)='+n),
        narration:'Edge case: <code>period</code> would be 0 (or rows exceed the string). Return <code>s</code> unchanged.',
        codeLine:1 });
      frames.push({ rows:[inputRow()],
        metrics:[{k:'period',v:'—'},{k:'r',v:'—'},{k:'collected',v:n},numRowsMetric(numRows)],
        compare:'<span class="ans">✓ "'+esc(s)+'"</span>',
        narration:'Return <code>s</code> as-is → <code>"'+esc(s)+'"</code>.',
        codeLine:1, done:true });
      return frames;
    }

    const period = 2 * (numRows - 1);
    const collected = [];                  // array of original indices in output order
    const got = new Array(n).fill(false);

    const inputRow = (pick) => ({ type:'cells', label:inputLabel,
      cells: chars.map((ch,i)=>{
        let cls = '';
        if (i === pick) cls = 'cur';
        else if (got[i]) cls = 'stored';
        return { value:ch, ix:i, cls, arrow: i===pick ? 'j' : '' };
      }) });

    const outRow = (done) => ({ type:'cells', label:'result <span style="color:var(--faint)">(read out so far)</span>',
      cells: collected.length
        ? collected.map((oi,k)=>({ value:chars[oi], ix:oi, cls: done ? 'match' : 'stored' }))
        : [{ value:'·', ix:null, cls:'empty' }] });

    const mets = (r, picked) => [
      { k:'period', v: period },
      { k:'r', v: r },
      { k:'collected', v: picked },
      numRowsMetric(numRows)
    ];

    frames.push({ rows:[inputRow(null), outRow(false)], metrics:mets('—', 0),
      compare:'period = 2·('+numRows+'−1) = '+period,
      narration:'Cycle length <code>period = '+period+'</code>. Collect each row’s indices directly.',
      codeLine:2 });

    for (let r=0;r<numRows;r++){
      const interior = (r !== 0 && r !== numRows-1);
      for (let j=r;j<n;j+=period){
        // main column
        collected.push(j); got[j] = true;
        frames.push({ rows:[inputRow(j), outRow(false)], metrics:mets(r, collected.length),
          compare:'row '+r+'  main  s['+j+'] = \''+esc(chars[j])+'\'',
          narration:'Row '+r+': take main-column char <code>s['+j+'] = \''+esc(chars[j])+'\'</code>.',
          codeLine:5 });
        if (interior){
          const diag = j + period - 2*r;
          if (diag < n){
            collected.push(diag); got[diag] = true;
            frames.push({ rows:[inputRow(diag), outRow(false)], metrics:mets(r, collected.length),
              compare:'row '+r+'  diag  s['+diag+'] = \''+esc(chars[diag])+'\'   (j+period−2r)',
              narration:'Interior row '+r+': also take diagonal char <code>s['+diag+'] = \''+esc(chars[diag])+'\'</code> at <code>j+period−2r</code>.',
              codeLine:7 });
          }
        }
      }
    }

    const result = collected.map(oi=>chars[oi]).join('');
    frames.push({ rows:[inputRow(null), outRow(true)], metrics:mets(numRows-1, collected.length),
      compare:'<span class="ans">✓ "'+esc(result)+'"</span>',
      narration:'All rows collected in order → <code>"'+esc(result)+'"</code>.',
      codeLine:9, done:true });
    return frames;
  }
}
];

// ---------- state ----------
let approach = APPROACHES[0];          // default: simulate
let presetName = 'rows3';
let curS = PRESETS.rows3.s;
let curRows = PRESETS.rows3.numRows;
let frames = [];
let idx = 0;
let playing = false;
let timer = null;
const SPEEDS = [0.25, 0.5, 0.75, 1, 1.5, 2, 4];
let speedI = 3;

// ---------- rendering ----------
function cellWidth(n){ return n <= 6 ? 78 : n <= 8 ? 64 : n <= 11 ? 52 : n <= 14 ? 46 : 38; }

function cellsRowHTML(row, n){
  const w = cellWidth(n);
  const cells = row.cells.map(c=>{
    const cls = 'cell' + (c.cls ? ' '+c.cls : '');
    const arrow = c.arrow ? '<span class="arrow below"><b>▲</b>'+c.arrow+'</span>' : '';
    const ix = (c.ix!=null) ? '<span class="ix">'+c.ix+'</span>' : '';
    return '<div class="'+cls+'">'+esc(c.value)+ix+arrow+'</div>';
  }).join('');
  return '<div class="rowlabel">'+row.label+'</div><div class="cells" style="grid-template-columns:repeat('+n+','+w+'px)">'+cells+'</div>';
}
function chipsRowHTML(row){
  const chips = row.chips.length
    ? row.chips.map(e=>'<div class="chip '+(e.hl||'')+'">'+e.key+'<span>→ '+e.idx+'</span></div>').join('')
    : '<div class="chip-empty">empty</div>';
  return '<div class="rowlabel sp">'+row.label+'</div><div class="chips">'+chips+'</div>';
}

// code panel: pseudocode tokens OR a real language; BOTH highlight the active line.
function codeLinesHTML(view){
  if (view === 'pseudo'){
    return approach.code.map((toks,i)=>{
      const inner = toks.map(([c,t])=>'<span class="'+c+'">'+esc(t)+'</span>').join('');
      return '<div class="ln" data-line="'+(i+1)+'"><span class="no">'+(i+1)+'</span><span>'+inner+'</span></div>';
    }).join('');
  }
  return (approach.src[view]||'').split('\n').map((ln,i)=>
    '<div class="ln" data-line="'+(i+1)+'"><span class="no">'+(i+1)+'</span><span>'+highlight(ln, view)+'</span></div>'
  ).join('');
}
function highlightLine(){
  const f = frames[idx]; if (!f) return;
  let active = f.codeLine;
  if (codeView !== 'pseudo'){ const m = approach.map && approach.map[codeView]; active = m ? m[f.codeLine] : -1; }
  document.querySelectorAll('#code .ln').forEach(ln=>ln.classList.toggle('active', +ln.dataset.line === active));
}
function renderCodeView(){
  document.querySelectorAll('#codetabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===codeView));
  document.getElementById('code').innerHTML = codeLinesHTML(codeView);
  highlightLine();
}
function renderLegend(){
  document.getElementById('legend').innerHTML = approach.legend
    .map(([sw,txt])=>'<div class="it"><span class="sw '+sw+'"></span>'+txt+'</div>').join('');
}

let codeView = 'pseudo';
function setCodeView(v){ codeView = v; renderCodeView(); }

function render(){
  const f = frames[idx];
  let n = 0;
  f.rows.forEach(r=>{ if (r.type==='cells') n = Math.max(n, r.cells.length); });
  document.getElementById('stage').innerHTML =
    '<div class="compare">'+f.compare+'</div>' +
    f.rows.map(r => r.type==='cells' ? cellsRowHTML(r,n) : chipsRowHTML(r)).join('');

  document.getElementById('metrics').innerHTML = f.metrics.map(m=>{
    const wide = m.wide ? ' wide' : '';
    const vcls = 'v' + (m.v==='—' ? ' muted' : '');
    return '<div class="metric'+wide+'"><div class="'+vcls+'">'+m.v+'</div><div class="k">'+m.k+'</div></div>';
  }).join('');

  document.getElementById('narration').innerHTML = f.narration;

  highlightLine();

  const last = frames.length - 1;
  const scrub = document.getElementById('scrub');
  scrub.max = last; scrub.value = idx;
  scrub.style.setProperty('--p', (last ? idx/last*100 : 0)+'%');
  document.getElementById('counter').textContent = (idx+1) + ' / ' + (last+1);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === last;
}

// ---------- transport ----------
function goto(i){
  const last = frames.length - 1;
  idx = Math.max(0, Math.min(last, i));
  render();
  if (idx === last) stop();
}
function next(){ if (idx < frames.length-1) goto(idx+1); }
function prev(){ goto(idx-1); }
function play(){
  if (idx >= frames.length-1) idx = 0;
  playing = true; setPlayIcon(true);
  const delay = 800 / SPEEDS[speedI];
  timer = setInterval(()=>{ if (idx >= frames.length-1){ stop(); return; } goto(idx+1); }, delay);
}
function stop(){ playing = false; setPlayIcon(false); if (timer){ clearInterval(timer); timer = null; } }
function toggle(){ playing ? stop() : play(); }
function setPlayIcon(on){
  document.getElementById('playIcon').innerHTML = on
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

// ---------- build / switch ----------
function rebuild(){
  stop();
  frames = approach.build(curS, curRows);
  idx = 0;
  document.getElementById('comp').innerHTML = '<b>'+approach.comp.split('·')[0].trim()+'</b> · '+approach.comp.split('·').slice(1).join('·').trim();
  render();
}
function setApproach(ap){
  approach = ap;
  document.querySelectorAll('#approaches button').forEach(b=>b.classList.toggle('on', b.dataset.a===ap.id));
  renderLegend();
  document.getElementById('how').innerHTML = ap.how;
  renderCodeView();
  rebuild();
}
function setPreset(name){
  presetName = name;
  curS = PRESETS[name].s;
  curRows = PRESETS[name].numRows;
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on', b.dataset.p===name));
  rebuild();
}
function randomInput(){
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const len = 6 + Math.floor(Math.random()*7);                     // 6..12
  curS = Array.from({length:len}, ()=> alpha[Math.floor(Math.random()*alpha.length)]).join('');
  curRows = 2 + Math.floor(Math.random()*4);                       // 2..5
  document.querySelectorAll('#presets button').forEach(x=>x.classList.remove('on'));
  rebuild();
}

// ---------- wiring ----------
document.getElementById('approaches').innerHTML = APPROACHES
  .map(a=>'<button data-a="'+a.id+'">'+a.label+'</button>').join('');
document.getElementById('approaches').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  setApproach(APPROACHES.find(a=>a.id===b.dataset.a));
});
document.getElementById('presets').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  setPreset(b.dataset.p);
});
document.getElementById('codetabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  setCodeView(b.dataset.v);
});
document.getElementById('newBtn').addEventListener('click', randomInput);
document.getElementById('playBtn').addEventListener('click', toggle);
document.getElementById('nextBtn').addEventListener('click', ()=>{ stop(); next(); });
document.getElementById('prevBtn').addEventListener('click', ()=>{ stop(); prev(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{ stop(); goto(0); });
document.getElementById('scrub').addEventListener('input', e=>{ stop(); goto(+e.target.value); });
document.getElementById('speed').addEventListener('input', e=>{
  speedI = +e.target.value;
  document.getElementById('mult').innerHTML = SPEEDS[speedI] + '&times;';
  if (playing){ stop(); play(); }
});
document.addEventListener('keydown', e=>{
  if (e.key === ' '){ e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight'){ stop(); next(); }
  else if (e.key === 'ArrowLeft'){ stop(); prev(); }
});

// ---------- init ----------
document.getElementById('mult').innerHTML = SPEEDS[speedI] + '&times;';
setApproach(approach);   // renders code/legend/how + builds frames
setCodeView('pseudo');
</script>
<script>
(function(){
  var KEY='lc-anim-theme', root=document.documentElement, b=document.getElementById('themeToggle');
  if(!b) return;
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function icon(){ b.innerHTML = root.getAttribute('data-theme')==='light' ? MOON : SUN; }
  function set(t){ if(t==='light') root.setAttribute('data-theme','light'); else root.removeAttribute('data-theme'); try{localStorage.setItem(KEY,t);}catch(e){} icon(); }
  icon();
  b.addEventListener('click', function(){ set(root.getAttribute('data-theme')==='light' ? 'dark' : 'light'); });
})();
</script>
