site_name: Senior Stack
site_description: A field guide for senior software engineering — 50+ roadmaps, 100 annotated Leetcode solutions, and system design patterns curated by Bakhodir Yashin Mansur.
site_author: Bakhodir Yashin Mansur
site_url: https://senior-stack.uz/

copyright: >
  // all documentation generated with
  <a href="https://claude.com/claude-code" target="_blank" rel="noopener">claude</a>
  &nbsp;·&nbsp; © 2026 senior-project
  &nbsp;·&nbsp; <a href="#__consent">Change cookie settings</a>

repo_url: https://github.com/bakhod1r/SeniorProject
repo_name: bakhod1r/SeniorProject
edit_uri: edit/main/

docs_dir: _docs
site_dir: _site

exclude_docs: |
  TEMPLATE.md
  **/TEMPLATE.md
  .pages
  **/.pages
  Roadmap/**/index.md
  System Design/**/index.md

theme:
  name: material
  custom_dir: mkdocs/theme
  language: en
  features:
    # - navigation.instant
    # - navigation.instant.progress
    # - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to sepia mode
    - scheme: senior-sepia
      primary: custom
      accent: custom
      toggle:
        icon: material/book-open-page-variant
        name: Switch to dark mode
  logo: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    status:
      coming-soon: material/clock-outline
      new: material/alert-decagram
      deprecated: material/trash-can

hooks:
  - mkdocs/hooks/sibling_nav.py
  - mkdocs/hooks/read_manifest.py
  - mkdocs/hooks/seo_meta.py

plugins:
  - awesome-pages:
      strict: false
      order: asc
      sort_type: natural
      order_by: filename
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      js_files:
        - assets/extra.js
        - assets/eink.js
        - assets/fontsize.js
        - assets/reading.js
        - assets/pagefind-init.js
      css_files:
        - assets/extra.css
        - assets/eink.css
        - assets/fontsize.css
        - assets/reading.css
        - assets/pagefind-init.css
        - assets/fonts/intel-one-mono.css
  - redirects:
      # Programming restructure: legacy URLs that external
      # bookmarks / search engines still point at after the move.
      # NOTE: redirects must run AFTER minify so its stubs are emitted
      # after asset post-processing — minify mutates extra_javascript
      # entries in on_pre_build, and re-runs of on_post_build break
      # if a later plugin's pre/post-build cycle is triggered.
